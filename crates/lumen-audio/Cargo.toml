[package]
name = "lumen-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mic capture, VAD, WAV editing, dual-track meeting recorder"

[dependencies]
cpal = { workspace = true }
parking_lot = "0.12"
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
hound = "3"
same-file = "1"
# Streaming Ogg-Opus meeting recording (pure-Rust ogg muxing + libopus via the
# `opus` crate's vendored build; needs a C compiler at build time).
ogg = "0.8"
opus = "0.3"
# Silero VAD via official sherpa-onnx bindings (downloads a prebuilt static
# lib on first build — same mechanism as lumen-asr-engine).
sherpa-onnx = { version = "1.13.4", optional = true }

[dev-dependencies]
tempfile = "3"
serde_json = { workspace = true }
# Model-path resolution for the model-gated silero test.
lumen-models = { path = "../lumen-models" }

[features]
default = ["silero"]
# Silero VAD backend for mic capture (pulls sherpa-onnx + ONNX Runtime).
# Disable for consumers that only need capture / RMS VAD / WAV editing.
silero = ["dep:sherpa-onnx"]
