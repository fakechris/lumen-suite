[package]
name = "lumen-models"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared ASR model path resolution, readiness checks, install locking, and downloads for the Lumen product cluster"

[dependencies]
# OS-level advisory file locks for the cross-process install lock.
fs2 = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# SHA256 verification for raw (non-archive) model downloads.
sha2 = { version = "0.10", optional = true }

[features]
default = ["download"]
# Model package download/install (uses system `curl` + `tar`). Disable for
# path-resolution-only consumers.
download = ["dep:sha2"]
