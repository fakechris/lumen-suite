[package]
name = "lumen-models"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared ASR model path resolution, readiness checks, install locking, and downloads for the Lumen product cluster"

[dependencies]
# OS-level advisory file locks for the cross-process install lock.
fs2 = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
bzip2 = { version = "0.5", optional = true }
tar = { version = "0.4", optional = true }

[features]
default = ["download"]
# SenseVoice package download/install implemented in-process so packaged
# Windows apps do not depend on system curl/tar programs.
download = ["dep:reqwest", "dep:bzip2", "dep:tar"]
