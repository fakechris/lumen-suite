[package]
name = "lumen-models"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared ASR model path resolution, readiness checks, install locking, and downloads for the Lumen product cluster"

[dependencies]
# OS-level advisory file locks for the cross-process install lock.
fs2 = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[features]
default = ["download"]
# SenseVoice package download/install (uses system `curl` + `tar`; no extra
# Rust dependencies). Disable for path-resolution-only consumers.
download = []
