[package]
name = "diar-rs"
version = "0.1.0"
edition = "2021"
description = "Open-source speaker diarization (WeSpeaker emb + DiariZen seg + BUT VBx), scored vs human-annotated GT"
license = "MIT"
publish = false
keywords = ["diarization", "speaker-diarization", "onnx", "meeting", "audio"]
categories = ["multimedia::audio", "science"]
rust-version = "1.74"

[lib]
name = "diar_rs"
# rlib for Rust consumers; cdylib/staticlib for C embedding (Stage 5).
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "diar-rs"
path = "src/bin/diar.rs"

[features]
default = []
## Enable C ABI exports in `ffi` module.
ffi = []

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
byteorder = "1"
ort = { version = "2.0.0-rc.12", features = ["download-binaries", "ndarray"] }
hound = "3.5.1"
kodama = "0.3"

[build-dependencies]
cc = "1"

[dev-dependencies]
approx = "0.5"
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
